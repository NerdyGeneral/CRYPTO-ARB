name: Windows paper engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck, lint and unit tests
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm test

      - name: Build ArbiterPaper.exe
        run: pnpm build:exe

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $env:ARBITER_NO_BROWSER = "1"
          $env:ARBITER_DATA_DIR = Join-Path $env:RUNNER_TEMP "arbiter-data"
          $proc = Start-Process -FilePath release\ArbiterPaper.exe -PassThru -NoNewWindow `
            -RedirectStandardOutput engine-out.txt -RedirectStandardError engine-err.txt
          # CEX.IO allows about 100 requests a minute per IP, so its 80 books subscribe at one a second.
          Start-Sleep -Seconds 120
          try {
            $state = Invoke-RestMethod http://127.0.0.1:4173/api/state
            # The Settings tab saves through this endpoint; a request without the dashboard's header is refused.
            $saved = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4173/api/config -Headers @{ 'X-Arbiter' = '1' } `
              -ContentType 'application/json' -Body '{"settings":{"minNet":0.3}}'
            $refused = Invoke-WebRequest -Method Post -Uri http://127.0.0.1:4173/api/config -ContentType 'application/json' -Body '{}' -SkipHttpErrorCheck
            # "Start with Windows" adds a shortcut to the Startup folder and removes it again.
            $link = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\Arbiter Paper Engine.lnk'
            $autostartOn = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4173/api/config -Headers @{ 'X-Arbiter' = '1' } `
              -ContentType 'application/json' -Body '{"startWithWindows":true}'
            $linkTarget = if (Test-Path $link) { (New-Object -ComObject WScript.Shell).CreateShortcut($link).TargetPath } else { $null }
            $null = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4173/api/config -Headers @{ 'X-Arbiter' = '1' } `
              -ContentType 'application/json' -Body '{"startWithWindows":false}'
            $linkLeft = Test-Path $link
          }
          finally { Get-Content engine-out.txt, engine-err.txt | Write-Host }
          $state.feeds | Format-Table venue, live, markets, streaming, streamQuotes, restQuotes, restErrors, latencyMs | Out-String | Write-Host
          $state.routes | Select-Object -First 8 | Format-Table kind, path, notional, grossPct, net | Out-String | Write-Host
          $live = ($state.feeds | Measure-Object -Property live -Sum).Sum
          $books = ($state.feeds | Measure-Object -Property markets -Sum).Sum
          $streaming = @($state.feeds | Where-Object { $_.streaming }).Count
          $binance = $state.feeds | Where-Object { $_.venue -eq 'Binance.US' }
          $cex = $state.feeds | Where-Object { $_.venue -eq 'CEX.IO' }
          $helper = Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object { $_.ParentProcessId -eq $proc.Id }
          Write-Host "Coins $($state.coverage.coins) ($($state.coverage.source)), live books $live/$books, streaming exchanges $streaming, Binance.US streaming: $($binance.streaming), CEX.IO live $($cex.live)/$($cex.markets), USDT `$$($state.rates.USDT.mid), scans $($state.session.scans), keep-awake helper running: $([bool]$helper)"
          Stop-Process -Id $proc.Id
          if (-not $state.ready -or $state.coverage.source -ne 'live' -or $state.coverage.coins -lt 100) { throw "Market discovery did not complete" }
          if ($live -lt [math]::Floor($books * 0.8)) { throw "Too few live order books" }
          if ($streaming -lt 5) { throw "Expected at least 5 streaming exchanges" }
          if (-not $binance.streaming) { throw "Binance.US is not streaming" }
          if ($cex.live -lt [math]::Floor($cex.markets * 0.5)) { throw "CEX.IO feeds are down (likely rate-limited)" }
          if (-not $state.rates.USDT) { throw "No live USDT/USD rate" }
          if ($state.session.scans -lt 10) { throw "Engine is not scanning" }
          if (-not $helper) { throw "Keep-awake helper did not start" }
          if (@($state.feeds | Where-Object { $_.latencyMeasured }).Count -lt 5) { throw "Exchange latency was not measured" }
          if ($null -eq $state.shadow -or $null -eq $state.accuracy) { throw "Shadow and accuracy figures are missing" }
          Write-Host "Carry: $(@($state.carry.perps).Count) US perps, $(@($state.carry.dated).Count) dated futures, error: $($state.carry.error); reaction median $($state.reaction.medianMs) ms over $($state.reaction.samples) price changes"
          if (@($state.carry.perps).Count -lt 10) { throw "Coinbase's US perpetual futures were not loaded" }
          if (@($state.carry.perps | Where-Object { $_.bid -and $_.spotVenue }).Count -lt 10) { throw "Carry legs are missing prices" }
          if ($state.reaction.samples -lt 100) { throw "The engine is not reacting to price changes" }
          if ($saved.config.settings.minNet -ne 0.3) { throw "Settings were not saved through the dashboard API" }
          if ($refused.StatusCode -ne 404) { throw "A settings change without the dashboard header was accepted" }
          Write-Host "Startup shortcut target: $linkTarget"
          if (-not $autostartOn.autostart -or -not "$linkTarget".EndsWith('ArbiterPaper.exe')) { throw "Start with Windows did not create the startup shortcut" }
          if ($linkLeft) { throw "Turning off Start with Windows left the shortcut behind" }
          # The helper must release the PC once the engine is gone.
          Start-Sleep -Seconds 30
          if (Get-Process -Id $helper.ProcessId -ErrorAction SilentlyContinue) { throw "Keep-awake helper outlived the engine" }
          $configFile = Join-Path $env:ARBITER_DATA_DIR "config.json"
          if (-not (Test-Path $configFile)) { throw "Data folder was not created" }
          if ((Get-Content $configFile -Raw | ConvertFrom-Json).settings.minNet -ne 0.3) { throw "Saved settings did not reach config.json" }

      - uses: actions/upload-artifact@v4
        with:
          name: ArbiterPaper-windows
          path: release/ArbiterPaper.exe

      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view paper-engine-latest >/dev/null 2>&1 || gh release create paper-engine-latest --prerelease \
            --title "Arbiter paper engine (latest)" --target "$GITHUB_SHA" \
            --notes "Windows build of the background paper-trading engine from main. Simulated trades only; no orders are placed."
          gh release upload paper-engine-latest release/ArbiterPaper.exe --clobber
